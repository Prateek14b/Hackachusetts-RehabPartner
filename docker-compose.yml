# Local Postgres for development. In AWS the same code points at Aurora DSQL (Postgres-compatible)
# via the DATABASE_URL environment variable.
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: rehab
      POSTGRES_DB: rehab
    ports:
      - "5433:5432" # 5433 on the host so it never clashes with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehab -d rehab"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
